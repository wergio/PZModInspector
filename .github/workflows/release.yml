name: Release

# A tag v1.0.0 makes the release 1.0.0; a tag with a hyphen (v1.1.0-beta.1) makes a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag $tag is not vX.Y.Z or vX.Y.Z-suffix (e.g. v1.0.0, v1.1.0-beta.1)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ steps.version.outputs.version }}'
          dotnet publish src/PZModInspector.App -p:PublishProfile=win-x64 -p:Version=$version
          dotnet publish src/PZModInspector.Cli -p:PublishProfile=win-x64 -p:Version=$version

      - name: Installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = & $find
          }
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) not found.' }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" installer\PZModInspector.iss

      - name: Release files and SHA-256
        run: |
          $version = '${{ steps.version.outputs.version }}'
          Copy-Item publish\PZModInspector.exe, publish\PZModInspectorCLI.exe artifacts\
          $files = "PZModInspector-Setup-$version.exe", 'PZModInspector.exe', 'PZModInspectorCLI.exe'
          $files | ForEach-Object {
            $hash = (Get-FileHash "artifacts\$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content artifacts\SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts\SHA256SUMS.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.version }}'
          $arguments = @(
            'release', 'create', $tag,
            "artifacts\PZModInspector-Setup-$version.exe", 'artifacts\PZModInspector.exe', 'artifacts\PZModInspectorCLI.exe',
            'artifacts\SHA256SUMS.txt',
            '--title', "PZ Mod Inspector $version",
            '--generate-notes', '--verify-tag'
          )
          if ('${{ steps.version.outputs.prerelease }}' -eq 'True') { $arguments += '--prerelease' }
          gh @arguments
